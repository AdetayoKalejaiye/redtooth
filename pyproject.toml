[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redtooth"
version = "0.1.0"
description = "Agentic Bluetooth: connect to the devices people mean, find and send files fast."
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "python-pptx>=0.6.23",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "sqlite-vec>=0.1.6",
  "reportlab>=4.0",
  "watchdog>=4.0",
  "psutil>=5.9",
  "pystray>=0.19",  # tray icon
  "pillow>=10",
  # Windows: Bluetooth discovery and pairing, Wi-Fi Direct, Accept/Decline toasts, switching the audio output.
  "winrt-runtime>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth; sys_platform == 'win32'",
  "winrt-Windows.Devices.WiFiDirect; sys_platform == 'win32'",
  "winrt-Windows.Devices.Radios; sys_platform == 'win32'",
  "winrt-Windows.Media.Devices; sys_platform == 'win32'",
  "comtypes>=1.4.8; sys_platform == 'win32'",
  "win11toast>=0.35; sys_platform == 'win32'",
  "pycaw>=20260927; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
# Kept so older install commands still work; everything is in the base install now.
windows = []
phone = []
tray = []

[project.scripts]
redtooth = "redtooth.cli:main"

[tool.setuptools.packages.find]
include = ["redtooth*"]

[tool.setuptools.package-data]
redtooth = ["web/*", "search_eval/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
