# The shared Redtooth directory on Render's free plan (no card): New › Blueprint, pick this repo.
# A free web service loses its disk on every restart, so registrations live in Postgres:
# make a free database at neon.tech (no card) and paste its connection string as DATABASE_URL.
# No phone verification for now: first claim wins, extra devices join with a link code.
# (To text codes later: drop --open-register and add TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_VERIFY_SID.)
services:
  - type: web
    name: redtooth-directory
    runtime: python
    plan: free
    buildCommand: pip install ".[server]"
    startCommand: redtooth directory --host 0.0.0.0 --port $PORT --open-register
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
