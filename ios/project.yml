# Core tests run with `swift test` in Packages/RedtoothCore (or open Package.swift in Xcode).
# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
name: Redtooth
options:
  bundleIdPrefix: app.redtooth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # set your team
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RedtoothCore:
    path: Packages/RedtoothCore
targets:
  Redtooth:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RedtoothCore
      - target: RedtoothShare
      - target: RedtoothControls
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Redtooth
        CFBundleURLTypes: [{ CFBundleURLName: app.redtooth, CFBundleURLSchemes: [redtooth] }]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSContactsUsageDescription: Redtooth matches names like “Daniel” to the people in your contacts.
        NSLocalNetworkUsageDescription: Redtooth sends files directly to nearby phones and computers.
        NSBluetoothAlwaysUsageDescription: Redtooth notices when a friend's phone is nearby so it can pick the right person.
        NSBonjourServices: [_redtooth._tcp]
        WiFiAwareServices:
          _redtooth._tcp:
            Publishable: { Transport: TCP }
            Subscribable: {}
        UIBackgroundModes: [remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [app.redtooth.index]
    entitlements:
      path: App/Redtooth.entitlements
      properties:
        com.apple.security.application-groups: [group.app.redtooth]
        aps-environment: development
        com.apple.developer.wifi-aware: [Publish, Subscribe]
  RedtoothShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, App/Shared.swift]
    dependencies:
      - package: RedtoothCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Redtooth
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
        NSLocalNetworkUsageDescription: Redtooth sends files directly to nearby phones and computers.
        NSBonjourServices: [_redtooth._tcp]
    entitlements:
      path: ShareExtension/RedtoothShare.entitlements
      properties:
        com.apple.security.application-groups: [group.app.redtooth]
  RedtoothControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Controls]
    info:
      path: Controls/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/RedtoothControls.entitlements
      properties:
        com.apple.security.application-groups: [group.app.redtooth]
